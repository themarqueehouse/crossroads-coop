<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Co-op two-core test rig</title>
<style>
  body { font: 13px/1.5 monospace; margin: 12px; }
  canvas { image-rendering: pixelated; width: 360px; height: 240px; border: 1px solid #888; }
  #log { white-space: pre-wrap; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<div>
  <canvas id="s0" width="240" height="160"></canvas>
  <canvas id="s1" width="240" height="160"></canvas>
</div>
<pre id="log"></pre>
<script type="module">
// Both games in ONE page, with the relay between them running in-process.
//
// The previous rig drove the relay from Node over the Playwright bridge. Each
// pump was a few milliseconds of round-trips while both emulators kept running
// at full speed, so the mailbox rings -- seven frames deep, filled one frame per
// frame -- overflowed between pumps and dropped the chunks of a block transfer.
// That looked exactly like a co-op bug and was not one.
//
// Hosting both cores here fixes it at the root: the pump runs inside the same
// frame callback the cores do, so it cannot fall behind them. It also matches
// what the real wrapper does, which is the configuration we actually ship.
import mGBA from './mgba.js';

const log = (m) => {
  document.getElementById('log').textContent += m + '\n';
};

const MAGIC = 0x504f4f43; // 'COOP'

// struct NetMailbox, include/net_link.h.
const OFF = {
  magic: 0x00, hostStatus: 0x05, localId: 0x06, playerCount: 0x07,
  outHead: 0x08, outTail: 0x09, inHead: 0x0a, inTail: 0x0c, heartbeat: 0x0e,
  out: 0x10, in: 0x90,
  // The diagnostics block the ROM publishes about itself.
  coopState: 0x190, linkFlags: 0x191, posSent: 0x192, posRecv: 0x194,
  peerMap: 0x196, peerX: 0x198, peerY: 0x19a, selfMap: 0x19c, joinStep: 0x19f,
  deltasSent: 0x1a0, deltasRecv: 0x1a2, deltasDropped: 0x1a4, gateId: 0x1a6,
};
const COOP_STATE = ['OFF', 'OPENING', 'EXCHANGING', 'ACTIVE', 'LOST'];
// Must match enum CoopJoinStep in src/coop.c, in order.
const JOIN_STEP = ['SEND_PLAYER2', 'SEND_WORLD', 'AWAIT_PLAYER2', 'DONE'];
const RING_SLOTS = 8, RING_MASK = 7, FRAME_BYTES = 16;

function sampleGates() {
  for (const c of cores) {
    if (c.base === null) continue;
    const g = c.u16(OFF.gateId);
    if (g !== 0 && g !== c.lastGate) c.gateLog.push(g);
    c.lastGate = g;
  }
}

class Core {
  constructor(id) {
    this.id = id;
    this.frames = 0;
    this.base = null;
    this.gateLog = [];
    this.lastGate = 0;
  }

  async boot(romUrl, romName, saveB64) {
    const bytes = await (await fetch(romUrl)).arrayBuffer();
    this.core = await mGBA({ canvas: document.getElementById('s' + this.id) });
    this.core.setLogger?.(() => {});
    // Save states and rewind each hold a full copy of EWRAM, magic word and
    // all, which is what makes the mailbox scan ambiguous. The real wrapper
    // disables them for the same reason.
    this.core.setCoreSettings?.({
      autoSaveStateEnable: false,
      restoreAutoSaveStateOnLoad: false,
      rewindEnable: false,
    });
    await this.core.FSInit();
    const file = new File([new Uint8Array(bytes)], romName);
    await new Promise((res) => this.core.uploadRom(file, res));

    // A save to start from, if one was handed in. It has to be on the chip
    // before loadGame, and named after the ROM, because that is how mGBA
    // decides the two belong together.
    if (saveB64) {
      const raw = atob(saveB64);
      const sav = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) sav[i] = raw.charCodeAt(i);
      const saveName = romName.replace(/\.gba$/i, '.sav');
      await new Promise((res) =>
        this.core.uploadSaveOrSaveState(new File([sav], saveName), res));
    }

    if (!this.core.loadGame(`${this.core.filePaths().gamePath}/${romName}`))
      throw new Error(`core ${this.id}: loadGame refused`);
    this.core.addCoreCallbacks({ keysReadCallback: () => { this.frames++; } });
    log(`core ${this.id}: loaded`);
  }

  // A fresh view every time: WASM memory growth detaches cached typed arrays.
  heap() { return new Uint8Array(this.core.coopHeapBuffer); }

  findLive() {
    const h = this.heap();
    const dv = new DataView(h.buffer);
    const hits = [];
    for (let i = 0; i + 4 <= h.length; i += 4)
      if (dv.getUint32(i, true) === MAGIC) hits.push(i);
    return hits;
  }

  rd(off, len) { return this.heap().subarray(this.base + off, this.base + off + len); }
  wr(off, bytes) { this.heap().set(bytes, this.base + off); }
  byte(off) { return this.heap()[this.base + off]; }
  setByte(off, v) { this.heap()[this.base + off] = v; }
  u16(off) { const h = this.heap(); return h[this.base + off] | (h[this.base + off + 1] << 8); }

  press(k) { this.core.buttonPress(k); }
  release(k) { this.core.buttonUnpress(k); }
}

const cores = [new Core(0), new Core(1)];
let pumping = false;

// One relay step, both directions, with loopback.
//
// A link cable hands every console EVERY console's command for that frame,
// including its own, and the game will not deliver a frame until every lane has
// one. So each command goes to the peer AND back to the sender's own lane.
function pumpOnce() {
  for (const src of cores) {
    const dst = cores[1 - src.id];
    const lane = src.byte(OFF.localId);
    let outTail = src.byte(OFF.outTail);
    const outHead = src.byte(OFF.outHead);

    const sinks = [dst, src];
    const heads = sinks.map((k) => k.byte(OFF.inHead + lane));
    const tails = sinks.map((k) => k.byte(OFF.inTail + lane));
    let moved = 0;

    while (outTail !== outHead) {
      if (heads.some((h, i) => ((h + 1) & RING_MASK) === tails[i])) break;
      const frame = src.rd(OFF.out + (outTail & RING_MASK) * FRAME_BYTES, FRAME_BYTES).slice();
      for (let i = 0; i < sinks.length; i++) {
        sinks[i].wr(OFF.in + (lane * RING_SLOTS + (heads[i] & RING_MASK)) * FRAME_BYTES, frame);
        heads[i] = (heads[i] + 1) & RING_MASK;
      }
      outTail = (outTail + 1) & RING_MASK;
      moved++;
    }
    if (moved) {
      for (let i = 0; i < sinks.length; i++) sinks[i].setByte(OFF.inHead + lane, heads[i]);
      src.setByte(OFF.outTail, outTail);
    }
  }
}

window.__pair = {
  // saveB64 goes to core 0 only: Player 1 owns the save, and Player 2's
  // console is meant to start blank and take its character over the link.
  async boot(romUrl, romName, saveB64) {
    for (const c of cores) await c.boot(romUrl, romName, c.id === 0 ? saveB64 : null);
    return true;
  },

  // Async, because telling the live mailbox from the stale copies means
  // watching the heartbeat actually advance -- which needs real frames to
  // pass. An earlier version spun a loop that broke immediately, so it compared
  // two reads taken at the same instant and concluded nothing was live.
  async locate() {
    const out = [];
    const sample = () => cores.map((c) =>
      c.findLive().map((b) => { c.base = b; return c.u16(OFF.heartbeat); }));

    const candidates = cores.map((c) => c.findLive());
    const before = sample();
    await window.__pair.wait(10);
    const after = sample();

    for (const c of cores) {
      const cands = candidates[c.id];
      const live = cands.filter((_, i) => before[c.id][i] !== after[c.id][i]);
      c.base = live.length ? live[0] : (cands.length ? cands[0] : null);
      out.push({ id: c.id, candidates: cands.length, live: live.length, base: c.base });
    }
    return out;
  },

  // paired=false brings the relay up but leaves the mailbox saying nobody is
  // there, which is what a console looks like when the other player has not
  // joined yet. The two-player gate on the main menu is the only thing that
  // reads it before the overworld exists, so it is the only way to test it.
  openSession(paired = true) {
    for (const c of cores) {
      c.setByte(OFF.localId, c.id);
      c.setByte(OFF.playerCount, paired ? 2 : 1);
      c.setByte(OFF.hostStatus, paired ? 2 : 1); // NET_HOST_READY : still waiting
    }
    // From here the relay runs on its own, every animation frame, so it keeps
    // pace with the cores instead of trailing a driver outside the page.
    if (!pumping) {
      pumping = true;
      const tick = () => {
        try { pumpOnce(); sampleGates(); } catch (e) { /* mid-reset */ }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
    return true;
  },

  // Bring the missing player in, once a test has checked what happens
  // without them.
  pairUp() {
    for (const c of cores) {
      c.setByte(OFF.playerCount, 2);
      c.setByte(OFF.hostStatus, 2);
    }
    return true;
  },

  // The save chip's contents, for building a starting save to hand over.
  // FSSync flushes the emulator's filesystem first; without it the bytes can
  // be a save or two behind what the game thinks it wrote.
  async sync() {
    await cores[0].core.FSSync();
    return true;
  },

  save() {
    return cores[0].core.getSave();
  },

  // Which gates each core passed through, in order.
  //
  // Sampled in the relay tick rather than polled from the test, because a gate
  // is only held for as long as the partner takes to arrive -- which, when both
  // are already there, is a frame or two. A poll every thirty frames sees an
  // empty gate before and after and concludes nothing happened.
  gateLog(which) { return cores[which].gateLog.slice(); },
  clearGateLog() { for (const c of cores) c.gateLog = []; return true; },

  // Held keys, for chords like R+Start. tap() cannot express one.
  hold(which, key) { cores[which].press(key); return true; },
  letGo(which, key) { cores[which].release(key); return true; },

  frames() { return cores.map((c) => c.frames); },

  // Drop and rebuild the session, without restarting either game.
  //
  // This is how the adoption path gets exercised. Player 2 claims the stored
  // slot on the first connect; on the second, Player 1's record is claimed, so
  // Player 2 should be handed that character back and become it. The record
  // lives in Player 1's SaveBlock1 in RAM, so none of this needs a save file --
  // which is what makes testing adoption cheap rather than a save/reload rig.
  async reconnect(gapFrames = 240) {
    for (const c of cores) c.setByte(OFF.hostStatus, 3); // NET_HOST_LOST
    await window.__pair.wait(gapFrames);
    for (const c of cores) c.setByte(OFF.hostStatus, 2); // NET_HOST_READY
    return true;
  },

  async tap(which, key, hold = 8) {
    const list = which === 'both' ? cores : [cores[which]];
    for (const c of list) c.press(key);
    const until = cores[0].frames + hold;
    while (cores[0].frames < until) await new Promise((r) => setTimeout(r, 4));
    for (const c of list) c.release(key);
  },

  async wait(n) {
    const until = cores[0].frames + n;
    const deadline = Date.now() + 120000;
    while (cores[0].frames < until) {
      if (Date.now() > deadline) throw new Error('cores stalled');
      await new Promise((r) => setTimeout(r, 4));
    }
  },

  // Read an arbitrary span of emulated memory, for checking the save block.
  // Set bits directly in emulated memory, to stage a precondition the game
  // would otherwise take an hour of play to reach.
  orByte(which, addr, value) {
    cores[which].heap()[addr] |= value;
    return true;
  },

  writeAt(which, addr, bytes) {
    cores[which].heap().set(Uint8Array.from(bytes), addr);
    return true;
  },

  readAt(which, addr, len) {
    return Array.from(cores[which].heap().subarray(addr, addr + len));
  },

  mailbox(which) {
    const c = cores[which];
    const flags = [[1, 'LINK_OPEN'], [2, 'PLAYERS_RECEIVED'], [4, 'CALLBACK_ARMED'],
                   [8, 'PEER_VALID'], [16, 'PEER_SAME_MAP'], [32, 'AT_GATE'],
                   [64, 'SCRIPT_BUSY'], [128, 'BATTLE']]
      .filter(([b]) => c.byte(OFF.linkFlags) & b).map(([, n]) => n);
    return {
      id: which,
      state: COOP_STATE[c.byte(OFF.coopState)] ?? c.byte(OFF.coopState),
      flags: flags.join('|') || '(none)',
      selfMap: '0x' + c.u16(OFF.selfMap).toString(16),
      peerMap: '0x' + c.u16(OFF.peerMap).toString(16),
      // Where the PARTNER is standing, as this console last heard it. Read
      // from the other console's mailbox it is the only way a test can watch a
      // player actually move: a test that asks instead whether a script is
      // running cannot tell "stuck in a refusal" from "a refusal happens to be
      // on screen this instant", and reported a soft-lock that was not one.
      peerPos: `${c.u16(OFF.peerX)},${c.u16(OFF.peerY)}`,
      join: JOIN_STEP[c.byte(OFF.joinStep)] ?? c.byte(OFF.joinStep),
      posSent: c.u16(OFF.posSent),
      posRecv: c.u16(OFF.posRecv),
      deltas: `${c.u16(OFF.deltasSent)} sent / ${c.u16(OFF.deltasRecv)} recv`,
      deltasDropped: c.u16(OFF.deltasDropped),
      gateId: c.u16(OFF.gateId),
      heartbeat: c.u16(OFF.heartbeat),
      outPending: (c.byte(OFF.outHead) - c.byte(OFF.outTail)) & RING_MASK,
    };
  },
};

log('pair rig ready');
</script>
</body>
</html>
